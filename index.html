<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff1b2d">
<title>Windos 5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#000;color:#f0f0f0;user-select:none}
input,textarea{user-select:text!important;-webkit-user-select:text!important;pointer-events:auto!important}
.hidden{display:none!important}
.bios-screen{position:fixed;inset:0;background:#000;z-index:1e5;padding:24px;font-family:monospace;color:#c0c0c0;font-size:14px;white-space:pre-wrap}
.boot-screen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0a0c,#0d0d0d 55%,#000);display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .5s}
.boot-screen.fade-out{opacity:0;pointer-events:none}
.gx-title{font-size:36px;font-weight:800;letter-spacing:6px;text-align:center}
.gx-title span{color:#ff1b2d;text-shadow:0 0 16px rgba(255,27,45,.45)}
.boot-bar{width:200px;height:3px;background:#222;margin:24px auto 12px;border-radius:2px;overflow:hidden}
.boot-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#c41424,#ff1b2d);transition:width .25s}
.login-screen{position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(255,27,45,.2),transparent 50%),#0a0a0a}
.login-card{width:min(340px,calc(100vw - 32px));background:rgba(18,18,18,.95);border:1px solid rgba(255,27,45,.25);border-radius:16px;padding:36px 28px;text-align:center}
.login-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff1b2d,#8b0000);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 14px;box-shadow:0 0 20px rgba(255,27,45,.4)}
.login-input{width:100%;padding:12px 14px;border:1px solid #333;border-radius:8px;background:#0a0a0a;color:#fff;font-size:15px;outline:none;margin:12px 0 8px}
.login-input:focus{border-color:#ff1b2d}
.login-btn{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#ff1b2d,#c41424);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-error{color:#ff1b2d;font-size:12px;min-height:16px}
.desktop{position:relative;width:100%;height:100%;overflow:hidden}
.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 30%,rgba(255,27,45,.22),transparent 45%),linear-gradient(165deg,#0a0a0a,#120808 35%,#0d0d0d)}
.desktop-icons{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:10;max-height:calc(100% - 70px)}
.desktop-icon{width:76px;padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center}
.desktop-icon:hover,.desktop-icon.selected{background:rgba(255,255,255,.12)}
.desktop-icon .icon-img{font-size:34px}
.desktop-icon .icon-label{font-size:11px;color:#fff;text-shadow:0 1px 3px #000;margin-top:2px}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:48px;background:rgba(32,32,32,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 8px;z-index:5000;gap:4px}
.taskbar-btn{width:44px;height:40px;border:none;background:0;color:#fff;border-radius:4px;cursor:pointer;font-size:18px}
.taskbar-btn:hover{background:rgba(255,255,255,.1)}
.taskbar-apps{flex:1;display:flex;justify-content:center;gap:4px}
.taskbar-app{width:44px;height:40px;border:none;background:0;border-radius:4px;cursor:pointer;font-size:20px;position:relative;color:#fff}
.taskbar-app.active{background:rgba(255,255,255,.15)}
.taskbar-app.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:3px;background:#ff1b2d;border-radius:2px}
.clock{margin-left:auto;padding:0 10px;font-size:13px}
.start-menu{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 24px));max-height:70vh;background:rgba(32,32,32,.96);border-radius:12px;border:1px solid rgba(255,255,255,.1);z-index:6000;overflow:auto;padding:14px}
.app-list-item{display:flex;align-items:center;gap:12px;padding:11px;border-radius:8px;cursor:pointer}
.app-list-item:hover{background:rgba(255,255,255,.1)}
.window{position:absolute;min-width:260px;min-height:160px;background:#1e1e1e;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;z-index:100}
.window.focused{box-shadow:0 16px 48px rgba(0,0,0,.65),0 0 0 1px rgba(255,27,45,.3)}
.window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}
.window.minimized{display:none!important}
.window-titlebar{height:36px;background:#2d2d2d;display:flex;align-items:center;padding:0 4px 0 12px;cursor:move;flex-shrink:0}
.window-title{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.window-controls{display:flex;z-index:30}
.window-btn{width:46px;height:36px;border:none;background:0;color:#fff;cursor:pointer;font-size:14px;pointer-events:auto!important}
.window-btn:hover{background:rgba(255,255,255,.1)}
.window-btn.close:hover{background:#e81123}
.window-content{flex:1;overflow:auto;background:#1e1e1e;user-select:text;-webkit-user-select:text;pointer-events:auto;position:relative}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(20,10,12,.95);border:1px solid rgba(255,27,45,.25);padding:12px 18px;border-radius:8px;z-index:10000;font-size:14px;max-width:90vw}
.btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-size:14px;color:#fff}
.btn-p{background:linear-gradient(135deg,#ff1b2d,#c41424)}
.btn-s{background:#2a2a2a}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.calc-btn{padding:14px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;font-size:17px;cursor:pointer}
.calc-display{grid-column:1/-1;padding:14px;background:#111;border-radius:8px;text-align:right;font-size:26px;min-height:44px}
.notes-ta{width:100%;height:100%;background:#0d0d0d;color:#eee;border:none;outline:none;padding:12px;resize:none}
.term-out{padding:12px;font-family:monospace;font-size:13px;color:#0f0;white-space:pre-wrap;flex:1;overflow:auto}
.term-in{flex:1;background:#0d0d0d;color:#0f0;border:none;outline:none;font-family:monospace;padding:8px}
.b-app{display:flex;flex-direction:column;height:100%}
.b-bar{display:flex;gap:4px;padding:6px;background:#161616;align-items:center;flex-shrink:0}
.b-btn{width:34px;height:30px;border:none;background:#2a2a2a;color:#fff;border-radius:5px;cursor:pointer}
.b-url{flex:1;padding:7px 10px;border:1px solid #333;border-radius:5px;background:#0d0d0d;color:#fff;outline:none;font-size:13px}
.b-home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1a0a0c,#0d0d0d 55%);overflow:auto}
.b-home h1{font-size:26px;font-weight:800;letter-spacing:2px}
.b-home h1 span{color:#ff1b2d}
.b-home form{display:flex;gap:8px;width:min(400px,100%)}
.b-home form input{flex:1;padding:11px 14px;border:1px solid #333;border-radius:20px;background:#161616;color:#fff;outline:none}
.b-home form button{padding:11px 18px;border:none;border-radius:20px;background:linear-gradient(135deg,#ff1b2d,#c41424);color:#fff;font-weight:600;cursor:pointer}
.b-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.b-links button{padding:10px 14px;border:1px solid rgba(255,27,45,.3);border-radius:8px;background:rgba(255,27,45,.08);color:#eee;cursor:pointer}
.rx{padding:20px;height:100%;overflow:auto;background:linear-gradient(180deg,#1a1a2e,#0d0d0d)}
.rx-hero{text-align:center;margin-bottom:18px}
.rx-hero .big{font-size:56px}
.rx-hero h1{font-size:26px;font-weight:800}
.rx-actions{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:20px}
.rx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rx-grid button{padding:12px;border:1px solid #333;border-radius:8px;background:#1e1e1e;color:#eee;cursor:pointer}
.rx-frame-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.rx-top{padding:6px 10px;background:#161616;display:flex;gap:8px;align-items:center;flex-shrink:0}
.files{padding:18px;height:100%;overflow:auto}
.files h2{margin-bottom:6px}
.files p{font-size:13px;opacity:.65;margin-bottom:14px;line-height:1.4}
.file-row{display:flex;align-items:center;gap:8px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #2a2a2a}
.file-meta{flex:1;min-width:0}
.file-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:11px;opacity:.5}
@media(pointer:coarse){.desktop-icon{width:84px}.desktop-icon .icon-img{font-size:38px}.taskbar{height:54px}.taskbar-btn,.taskbar-app{width:50px;height:46px}.window-btn{width:50px;height:40px}}
</style>
</head>
<body>
<div id="bios-screen" class="bios-screen"></div>
<div id="boot-screen" class="boot-screen hidden"><div><div class="gx-title">OPERA <span>GX</span></div><div style="opacity:.5;letter-spacing:3px;text-align:center;margin-top:6px">WINDOS 5</div><div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div></div></div>
<div id="login-screen" class="login-screen hidden"><div class="login-card"><div class="login-avatar">A</div><div style="font-size:20px;font-weight:600">Alessio</div><div style="font-size:12px;opacity:.5;margin:4px 0 12px">Windos 5</div><form id="login-form"><input type="password" id="login-password" class="login-input" placeholder="Passwort"><div id="login-error" class="login-error"></div><button type="submit" class="login-btn">Anmelden</button></form><div style="margin-top:12px;font-size:11px;opacity:.4">Passwort: heyduhacker123</div></div></div>
<div id="desktop" class="desktop hidden"><div class="wallpaper"></div><div id="desktop-icons" class="desktop-icons"></div><div id="windows-container"></div>
<div id="start-menu" class="start-menu hidden"><div style="font-weight:600;margin-bottom:10px">Apps</div><div id="all-apps"></div></div>
<div id="taskbar" class="taskbar"><button id="start-btn" class="taskbar-btn">⊞</button><div id="taskbar-apps" class="taskbar-apps"></div><div class="clock" id="clock-time">00:00</div></div>
</div>
<script src="pc.js"></script>
</body></html>
