<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff1b2d">
<title>Windos 5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#000;color:#f0f0f0;user-select:none}
input,textarea,button{font-family:inherit}
input,textarea{user-select:text!important;-webkit-user-select:text!important;pointer-events:auto!important}
.hidden{display:none!important}
#bios{position:fixed;inset:0;background:#000;z-index:100000;padding:20px;font-family:monospace;color:#aaa;font-size:13px;white-space:pre-wrap}
#boot{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0a0c,#0d0d0d 55%,#000);display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .5s}
#boot.fade{opacity:0;pointer-events:none}
.gx{font-size:34px;font-weight:800;letter-spacing:5px;text-align:center}
.gx span{color:#ff1b2d;text-shadow:0 0 14px rgba(255,27,45,.5)}
.bar{width:200px;height:3px;background:#222;margin:22px auto 10px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c41424,#ff1b2d);transition:width .2s}
#login{position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(255,27,45,.2),transparent 50%),#0a0a0a}
.card{width:min(320px,calc(100vw - 28px));background:rgba(18,18,18,.95);border:1px solid rgba(255,27,45,.25);border-radius:14px;padding:32px 24px;text-align:center}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ff1b2d,#8b0000);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 12px}
.inp{width:100%;padding:11px 12px;border:1px solid #333;border-radius:8px;background:#0a0a0a;color:#fff;font-size:15px;outline:none;margin:10px 0 6px}
.inp:focus{border-color:#ff1b2d}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;color:#fff}
.btn-p{background:linear-gradient(135deg,#ff1b2d,#c41424)}
.btn-s{background:#2a2a2a}
.btn-block{width:100%}
.err{color:#ff1b2d;font-size:12px;min-height:16px}
#desk{position:relative;width:100%;height:100%;overflow:hidden}
.wp{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 30%,rgba(255,27,45,.2),transparent 45%),linear-gradient(165deg,#0a0a0a,#120808 35%,#0d0d0d)}
#icons{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:10;max-height:calc(100% - 64px)}
.icon{width:74px;padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center}
.icon:hover,.icon.on{background:rgba(255,255,255,.12)}
.icon .ii{font-size:32px}
.icon .il{font-size:11px;color:#fff;text-shadow:0 1px 3px #000;margin-top:2px}
#tb{position:absolute;bottom:0;left:0;right:0;height:48px;background:rgba(32,32,32,.92);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 8px;z-index:5000;gap:4px}
.tb-b{width:42px;height:38px;border:none;background:0;color:#fff;border-radius:4px;cursor:pointer;font-size:17px}
.tb-b:hover{background:rgba(255,255,255,.1)}
#tb-apps{flex:1;display:flex;justify-content:center;gap:4px}
.tb-a{width:42px;height:38px;border:none;background:0;border-radius:4px;cursor:pointer;font-size:18px;position:relative;color:#fff}
.tb-a.on{background:rgba(255,255,255,.15)}
.tb-a.on::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:3px;background:#ff1b2d;border-radius:2px}
#clock{margin-left:auto;padding:0 10px;font-size:13px}
#start{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 20px));max-height:65vh;background:rgba(32,32,32,.97);border-radius:12px;border:1px solid rgba(255,255,255,.1);z-index:6000;overflow:auto;padding:12px}
.si{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer}
.si:hover{background:rgba(255,255,255,.1)}
.win{position:absolute;min-width:260px;min-height:160px;background:#1e1e1e;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;z-index:100}
.win.focus{box-shadow:0 16px 48px rgba(0,0,0,.65),0 0 0 1px rgba(255,27,45,.3)}
.win.max{top:0!important;left:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}
.win.min{display:none!important}
.wt{height:36px;background:#2d2d2d;display:flex;align-items:center;padding:0 4px 0 12px;cursor:move;flex-shrink:0}
.wt .t{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc{display:flex}
.wb{width:44px;height:36px;border:none;background:0;color:#fff;cursor:pointer;font-size:14px}
.wb:hover{background:rgba(255,255,255,.1)}
.wb.x:hover{background:#e81123}
.wbody{flex:1;overflow:auto;background:#1e1e1e;position:relative;user-select:text;-webkit-user-select:text}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(20,10,12,.95);border:1px solid rgba(255,27,45,.3);padding:10px 16px;border-radius:8px;z-index:10000;font-size:13px;max-width:90vw}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.calc .d{grid-column:1/-1;padding:14px;background:#111;border-radius:8px;text-align:right;font-size:24px}
.calc button{padding:14px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;font-size:16px;cursor:pointer}
.notes{width:100%;height:100%;background:#0d0d0d;color:#eee;border:none;outline:none;padding:12px;resize:none}
.term{display:flex;flex-direction:column;height:100%;background:#0c0c0c}
.term-o{flex:1;overflow:auto;padding:12px;font-family:monospace;font-size:13px;color:#0f0;white-space:pre-wrap}
.term-r{display:flex;padding:8px;border-top:1px solid #222}
.term-r input{flex:1;background:#0d0d0d;color:#0f0;border:none;outline:none;font-family:monospace;padding:6px}
.bwrap{display:flex;flex-direction:column;height:100%}
.bbar{display:flex;gap:4px;padding:6px;background:#161616;align-items:center;flex-shrink:0}
.bbar button{min-width:34px;height:30px;border:none;background:#2a2a2a;color:#fff;border-radius:5px;cursor:pointer;padding:0 8px}
.bbar input{flex:1;padding:7px 10px;border:1px solid #333;border-radius:5px;background:#0d0d0d;color:#fff;outline:none;font-size:13px}
.bpane{flex:1;position:relative;background:#111;overflow:hidden}
.bhome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1a0a0c,#0d0d0d 55%);overflow:auto}
.bhome h1{font-size:24px;font-weight:800;letter-spacing:2px}
.bhome h1 span{color:#ff1b2d}
.bhome form{display:flex;gap:8px;width:min(380px,100%)}
.bhome form input{flex:1;padding:10px 14px;border:1px solid #333;border-radius:18px;background:#161616;color:#fff;outline:none}
.bhome form button{padding:10px 16px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff1b2d,#c41424);color:#fff;font-weight:600;cursor:pointer}
.blinks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blinks button{padding:9px 12px;border:1px solid rgba(255,27,45,.3);border-radius:8px;background:rgba(255,27,45,.08);color:#eee;cursor:pointer}
.rx{padding:18px;height:100%;overflow:auto;background:linear-gradient(180deg,#1a1a2e,#0d0d0d)}
.rx .big{font-size:52px;text-align:center}
.rx h1{text-align:center;font-size:24px;margin:6px 0}
.rx p{text-align:center;opacity:.6;margin-bottom:14px}
.rx .acts{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
.rx .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rx .grid button{padding:12px;border:1px solid #333;border-radius:8px;background:#1e1e1e;color:#eee;cursor:pointer}
.rxframe{position:absolute;inset:0;display:flex;flex-direction:column}
.rxframe .top{padding:6px 10px;background:#161616;display:flex;gap:8px;align-items:center;flex-shrink:0}
.rxframe iframe{flex:1;border:none;width:100%;background:#111}
.files{padding:16px}
.files h2{margin-bottom:6px}
.files .desc{font-size:13px;opacity:.65;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:8px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #2a2a2a}
.fmeta{flex:1;min-width:0}
.fname{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-size:11px;opacity:.5}
@media(pointer:coarse){.icon{width:82px}.icon .ii{font-size:36px}#tb{height:54px}.tb-b,.tb-a{width:48px;height:44px}.wb{width:50px;height:40px}}
</style>
</head>
<body>
<div id="bios"></div>
<div id="boot" class="hidden"><div><div class="gx">OPERA <span>GX</span></div><div style="opacity:.5;letter-spacing:3px;text-align:center;margin-top:6px">WINDOS 5</div><div class="bar"><i id="bar"></i></div></div></div>
<div id="login" class="hidden"><div class="card"><div class="av">A</div><div style="font-size:18px;font-weight:600">Alessio</div><div style="font-size:12px;opacity:.5;margin:4px 0 10px">Windos 5</div><form id="lf"><input type="password" id="lp" class="inp" placeholder="Passwort"><div id="le" class="err"></div><button type="submit" class="btn btn-p btn-block">Anmelden</button></form><div style="margin-top:10px;font-size:11px;opacity:.4">Passwort: heyduhacker123</div></div></div>
<div id="desk" class="hidden"><div class="wp"></div><div id="icons"></div><div id="wins"></div>
<div id="start" class="hidden"><div style="font-weight:600;margin-bottom:8px">Apps</div><div id="alist"></div></div>
<div id="tb"><button class="tb-b" id="sbtn">⊞</button><div id="tb-apps"></div><div id="clock">00:00</div></div>
</div>

</script>
</body></html>
